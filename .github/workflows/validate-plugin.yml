name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  codex-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Failure-mode note: a registry outage fails this job; that is acceptable because it is a
      # non-default, CI-only gate (plan R5#4), not the default npm test suite that blocks every commit.
      - run: bash scripts/ci/codex-compat.sh 0.144.0
